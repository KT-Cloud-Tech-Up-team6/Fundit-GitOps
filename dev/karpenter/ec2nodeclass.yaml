apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: fundit-dev-default
spec:
  # KarpenterNodeRole-<clusterName> 명명 규약(Fundit-Infra modules/karpenter/main.tf)을 따라야
  # role 이름만 지정해도 Karpenter가 인스턴스 프로필을 자동으로 관리한다
  role: KarpenterNodeRole-fundit-dev-eks
  amiFamily: AL2023
  # 새 AMI가 나오면 기존 노드를 drift로 감지해 자동 교체한다. dev 환경이라 의도적으로 최신을 따라간다.
  # 재현 가능한 롤아웃이 필요해지면 al2023@vYYYYMMDD로 날짜를 고정한다.
  amiSelectorTerms:
    - alias: al2023@latest
  # 이슈 #92: fundit-dev-private-sn-1(10.0.10.0/24)이 기존 개별 보조 IP 배치로
  # 단편화돼 연속된 /28을 못 내줘서 Prefix Delegation 요청이 실패한다(Client.InsufficientCidrBlocks).
  # fundit-dev-private-sn-2(10.0.20.0/24)만 임시로 쓴다 — 이 AZ에 새 노드가 몰리는 건 감수한다.
  # 근본 해결(SN1 CIDR 예약)은 별도로 진행한다.
  # id 고정이라 이 서브넷이 나중에 재생성(Terraform replace)되면 ID가 바뀌어 조용히
  # 안 맞게 된다 — 근본 해결 때 태그 기반 선택으로 되돌리는 걸 같이 검토한다.
  subnetSelectorTerms:
    - id: subnet-0914fc324d008c63f
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: fundit-dev-eks
  tags:
    Project: Fundit
    Environment: dev
    ManagedBy: Karpenter
