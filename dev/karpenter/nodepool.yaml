apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: fundit-dev-default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: fundit-dev-default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # 인터럽션 큐(SQS) 없이 spot을 켜면 노드 회수 시 파드가 경고 없이 죽는다.
        # Fundit-Infra에 인터럽션 큐가 추가되기 전까지는 on-demand만 허용한다.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
      # 오래 떠 있는 노드의 커널·설정 드리프트를 방지하기 위한 주기적 교체
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
  # t3a.small(2vCPU/2GiB) 3대로 cpu 한도 6이 소진돼 신규 노드를 못 만들고,
  # DaemonSet·Deployment 파드가 Pending 상태로 남는 문제가 있다(이슈 #45).
  # requirements에 인스턴스 크기 제약이 없어 Karpenter가 어떤 크기를 고를지는
  # 예측할 수 없다 — 이 값은 "노드 몇 대분"이 아니라 전체 상한이다.
  # cpu는 t3a.small 기준 2대분(4vCPU)을 더해 10으로, memory는 기존에도
  # 여유가 있던 값이라 비례해 20Gi로 올린다.
  limits:
    cpu: "10"
    memory: 20Gi
