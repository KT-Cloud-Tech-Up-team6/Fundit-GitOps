apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: fundit-dev-default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: fundit-dev-default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # 인터럽션 큐(SQS) 없이 spot을 켜면 노드 회수 시 파드가 경고 없이 죽는다.
        # Fundit-Infra에 인터럽션 큐가 추가되기 전까지는 on-demand만 허용한다.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
      # 오래 떠 있는 노드의 커널·설정 드리프트를 방지하기 위한 주기적 교체
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  # 시스템 노드그룹 상시 용량(4vCPU/8Gi)만큼만 추가 허용하던 기존 2배 상한 때문에,
  # 특정 노드에 묶이지 않은 파드(admission hook Job 등)가 뜰 새 노드조차 못 만드는
  # 상황이 생겼다(이슈 #40). cpu 6·memory 12Gi로 올려 여유를 둔다.
  # requirements에 인스턴스 크기 제약이 없어 Karpenter가 이 한도 안에서 어떤 크기를
  # 고를지는 예측할 수 없다 — 이 값은 "노드 몇 대분"이 아니라 전체 상한이다.
  limits:
    cpu: "6"
    memory: 12Gi
