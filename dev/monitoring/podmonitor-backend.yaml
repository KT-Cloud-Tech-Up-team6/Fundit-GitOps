apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fundit-backend-metrics
  namespace: dev
  labels:
    # Prometheus의 podMonitorSelector가 이 라벨이 있는 PodMonitor만 수집한다.
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - fundit-auth
          - fundit-member
          - fundit-project
          - fundit-order
          - fundit-payment
          - fundit-fulfillment
          - fundit-notification
          - fundit-search
          - fundit-live
          - fundit-gateway
  # 파드를 직접 수집하므로 Service에 8081을 추가하지 않는다.
  podTargetLabels:
    - app.kubernetes.io/name
  podMetricsEndpoints:
    - port: management
      path: /actuator/prometheus
      interval: 15s
