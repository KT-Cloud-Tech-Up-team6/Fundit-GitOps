apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: fundit-routes
  namespace: monitoring
  labels:
    alertmanagerConfig: fundit
spec:
  route:
    receiver: 'slack-warning'     
    groupBy: ['alertname']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    muteTimeIntervals:
      - sleep-schedule            

    routes:
      - matchers:
          - name: severity
            value: critical
        receiver: 'slack-critical'
        repeatInterval: 1h          

      - matchers:
          - name: severity
            value: warning
        receiver: 'slack-warning'

      - matchers:
          - name: severity
            value: info
        receiver: 'slack-info'
        repeatInterval: 24h

  
  muteTimeIntervals:
    - name: sleep-schedule
      timeIntervals:
        - weekdays: ['saturday', 'sunday']
        - weekdays: ['monday:friday']
          times:
            - startTime: '21:00'
              endTime: '24:00'
        - weekdays: ['monday:friday']
          times:
            - startTime: '00:00'
              endTime: '08:30'

  receivers:
    - name: 'slack-critical'
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: url
          channel: '#fundit-alerts'
          sendResolved: true
          title: '🚨 [Critical] {{ .GroupLabels.alertname }}'
          text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

    - name: 'slack-warning'
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: url
          channel: '#fundit-alerts'
          sendResolved: true
          title: '⚠️ [Warning] {{ .GroupLabels.alertname }}'
          text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

    - name: 'slack-info'
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: url
          channel: '#fundit-alerts'
          sendResolved: false        
          title: 'ℹ️ [Info] {{ .GroupLabels.alertname }}'