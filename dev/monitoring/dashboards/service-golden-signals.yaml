apiVersion: v1
kind: ConfigMap
metadata:
  name: fundit-dashboard-service-golden-signals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  fundit-service-golden-signals.json: |
    {
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "id": 1,
          "title": "트래픽 - 결제 요청률 (상태별)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{pod=~\"fundit-payment-.*\"}[5m])) by (status)",
              "legendFormat": "상태: {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "에러율 - 결제 5xx 실패율 (목표 0.5% 이하)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [
            {
              "expr": "(sum(rate(http_server_requests_seconds_count{pod=~\"fundit-payment-.*\", status=~\"5..\"}[5m])) or vector(0)) / (sum(rate(http_server_requests_seconds_count{pod=~\"fundit-payment-.*\"}[5m])) > 0)",
              "legendFormat": "결제 5xx 실패율",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "트래픽 - 주문 & 프로젝트 요청률 (상태별)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{pod=~\"fundit-(order|project)-.*\"}[1m])) by (status)",
              "legendFormat": "상태: {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "지연시간 - 주요 서비스 p95 응답 지연 (초)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{pod=~\"fundit-(payment|order|project|gateway)-.*\"}[5m])) by (le, pod))",
              "legendFormat": "{{pod}} (p95)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "포화도 - 서비스별 CPU 사용량 (gateway/payment/project/order)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"dev\", pod=~\"fundit-(gateway|payment|project|order)-.*\", container!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["fundit", "golden-signals"],
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "Asia/Seoul",
      "title": "Fundit - 서비스 4 Golden Signals (결제·캠페인·주문)",
      "uid": "fundit-service-golden-signals",
      "version": 2
    }