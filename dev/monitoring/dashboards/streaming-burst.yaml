apiVersion: v1
kind: ConfigMap
metadata:
  name: fundit-dashboard-streaming-burst
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  fundit-streaming-burst.json: |
    {
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "id": 1,
          "title": "라이브 서비스 요청률 (상태별)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{pod=~\"fundit-live-.*\"}[5m])) by (status)",
              "legendFormat": "상태: {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "라이브 서비스 p95 응답 지연 (초)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{pod=~\"fundit-live-.*\"}[5m])) by (le))",
              "legendFormat": "라이브 p95 지연",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "카프카 이벤트 대기열 (Consumer Lag)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (topic) (kafka_consumergroup_lag{consumergroup=\"notification-service\"})",
              "legendFormat": "토픽: {{topic}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "AI 서비스 요청률 (파드별)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{pod=~\"fundit-ai-.*\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "라이브 & AI 서비스 CPU 사용량",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"dev\", pod=~\"fundit-(live|ai-.*)-.*\", container!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["fundit", "streaming", "burst-traffic"],
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "Asia/Seoul",
      "title": "Fundit - 라이브 스트리밍 품질 · 버스트 트래픽",
      "uid": "fundit-streaming-burst",
      "version": 2
    }