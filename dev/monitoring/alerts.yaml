apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fundit-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   
spec:
  groups:

    
    - name: fundit.critical
      rules:

        - alert: PaymentAPIDown
          expr: up{job="payment-service"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "결제 API 다운"
            description: "payment-service가 1분 이상 응답하지 않습니다."

        - alert: ProjectServiceDown
          expr: up{job="project-service"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "캠페인(프로젝트) API 다운"
            description: "project-service가 1분 이상 응답하지 않습니다."

        - alert: OrderServiceDown
          expr: up{job="order-service"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "주문(펀딩 참여) API 다운"
            description: "order-service가 1분 이상 응답하지 않습니다."

        - alert: OversellDetected
          expr: increase(campaign_oversell_count[1m]) > 0
          for: 0m   
          labels:
            severity: critical
          annotations:
            summary: "오버셀 발생"
            description: "캠페인 재고보다 많은 주문이 승인됐습니다. 즉시 확인이 필요합니다."

        - alert: CampaignOpenFailureRateHigh
          expr: |
            (
              sum(rate(campaign_open_concurrent_requests{status="fail"}[1m]))
              /
              sum(rate(campaign_open_concurrent_requests[1m]))
            ) > 0.01
          for: 30s   
          labels:
            severity: critical
          annotations:
            summary: "방송/펀딩 오픈 순간 처리 실패율 급증"
            description: "오픈 직후 처리 실패율이 1%를 초과했습니다 (목표: 처리율 99% 이상)."

        - alert: KafkaConsumerGroupLagHigh
          expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 1000
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "카프카 컨슈머 랙(Lag) 누적 심각"
            description: "Topic: {{ $labels.topic }}, ConsumerGroup: {{ $labels.consumergroup }}의 랙이 1000을 초과했습니다. 이벤트 처리가 지연되고 있습니다."

        - alert: DBConnectionPoolHigh
          expr: |
            (sum by (instance) (pg_stat_activity_count) / sum by (instance) (pg_settings_max_connections)) * 100 > 80
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL 커넥션 풀 고갈 위험"
            description: "{{ $labels.instance }} DB의 활성 커넥션 사용률이 80%를 초과했습니다. 신규 DB 연결이 거부될 수 있습니다."

    
    - name: fundit.warning
      rules:

        - alert: PaymentSuccessRateLow
          expr: |
            (
              sum(rate(payment_requests_total{status="success"}[5m]))
              /
              sum(rate(payment_requests_total[5m]))
            ) < 0.995
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "결제 성공률 SLO 미달"
            description: "최근 5분간 결제 성공률이 99.5% 미만입니다."

        - alert: InventoryMismatchRateHigh
          expr: |
            (
              sum(rate(campaign_amount_mismatch_count[10m]))
              /
              sum(rate(campaign_open_concurrent_requests[10m]))
            ) > 0.005
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "재고-주문 매칭 실패율 상승"
            description: "재고-주문 매칭 실패율이 0.5%를 초과했습니다."

        - alert: StreamRebufferRatioHigh
          expr: avg(stream_rebuffer_ratio) > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "방송 리버퍼링 비율 상승"
            description: "시청 시간 중 리버퍼링 비율이 1%를 초과했습니다."

        - alert: StreamStartLatencyHigh
          expr: histogram_quantile(0.95, rate(stream_start_latency_seconds_bucket[5m])) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "방송 시작 지연"
            description: "채널 생성부터 송출 시작까지 p95 지연이 30초를 초과했습니다."

    
    - name: fundit.infra
      rules:

        - alert: NodeCPUHigh
          expr: |
            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "노드 CPU 사용률 90% 초과"
            description: "{{ $labels.instance }} 노드의 CPU 사용률이 5분 이상 90%를 넘었습니다."

        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
          for: 5m
          labels:
            severity: critical   
          annotations:
            summary: "Pod 반복 재시작 (CrashLoopBackOff 의심)"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} 컨테이너가 10분 내 3회 이상 재시작했습니다."

        - alert: PodOOMKilled
          expr: |
            (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
              and on(namespace, pod, container)
            (increase(kube_pod_container_status_restarts_total[5m]) > 0)
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "파드 OOMKilled 발생"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) 컨테이너가 최근 5분 내 메모리 한도 초과(OOMKilled)로 강제 종료 및 재시작되었습니다."

        - alert: CNPGClusterDegraded
          expr: |
            (
              sum(kube_pod_status_phase{namespace="dev", pod=~"fundit-dev-postgres-.*", phase="Running"})
              or vector(0)
            ) < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "CNPG PostgreSQL 클러스터 전면 다운"
            description: "PostgreSQL 파드가 1분 이상 실행되지 않고 있습니다. 데이터베이스 연결이 불가능합니다."

        - alert: KarpenterControllerDown
          expr: kube_deployment_status_replicas_available{namespace="kube-system", deployment="karpenter"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Karpenter 컨트롤러 다운"
            description: "Karpenter 오토스케일러 컨트롤러 파드가 동작하지 않아 노드 프로비저닝이 중단될 수 있습니다."

        - alert: PodPendingStuck
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "파드 Pending 상태 지속"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} 파드가 5분 이상 Pending 상태입니다 (노드 자원 부족 또는 프로비저닝 실패 의심)."

        - alert: NodeMemoryHigh
          expr: |
            100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "노드 메모리 사용률 85% 초과"
            description: "{{ $labels.instance }} 노드의 메모리 사용률이 5분 이상 85%를 넘었습니다."

        - alert: PVCDiskUsageHigh
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC 디스크 사용률 85% 초과"
            description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} PVC 볼륨 사용률이 85%를 초과했습니다."

        - alert: KarpenterNodeScaleEvent
          expr: changes(sum(kube_node_info)[5m:1m]) > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "EKS 노드 수 변동 감지 (Karpenter 스케일링)"
            description: "최근 5분 내 클러스터 노드 수 변동이 감지되었습니다 (5분간 변동 횟수: {{ $value }}회)."

