apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: backend-services-metrics
  namespace: dev
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: fundit
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
