apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: backend-services-metrics
  namespace: dev
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - fundit-auth
          - fundit-fulfillment
          - fundit-gateway
          - fundit-live
          - fundit-member
          - fundit-notification
          - fundit-order
          - fundit-payment
          - fundit-project
          - fundit-search
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
---
# AI Copilot (포트: 8080, 경로: /metrics)
apiVersion: monitoring.coreos.com/v1
