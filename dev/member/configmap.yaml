apiVersion: v1
kind: ConfigMap
metadata:
  name: fundit-member-config
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-member
    app.kubernetes.io/part-of: fundit
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka.kafka.svc.cluster.local:9092
