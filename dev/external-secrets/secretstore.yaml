# 인증을 따로 지정하지 않으면 ESO 컨트롤러의 IRSA(fundit-dev-eks-external-secrets)로 읽는다
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: dev
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-parameter-store
  namespace: dev
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
