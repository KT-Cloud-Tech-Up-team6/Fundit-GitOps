apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fundit-notification
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-notification
    app.kubernetes.io/part-of: fundit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fundit-notification
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  triggers:
    # 1. CPU 사용률 급증 시 선제적 스케일아웃 (70%)
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"

    # NOTE: Kafka Lag 기반 트리거는 토픽 파티션(현재 PartitionCount=1)이 
    # 최소 3개 이상으로 증설된 이후 유휴 파드(Idle Consumer) 없이 동작하므로,
    # 파티션 증설 완료 후 주석 해제 예정.
    # - type: kafka
    #   metadata:
    #     bootstrapServers: kafka.kafka.svc.cluster.local:9092
    #     consumerGroup: notification-service
    #     topic: notification.raised.v1
    #     lagThreshold: "30"
    #     offsetResetPolicy: earliest
    # - type: kafka
    #   metadata:
    #     bootstrapServers: kafka.kafka.svc.cluster.local:9092
    #     consumerGroup: notification-service
    #     topic: live.started.v1
    #     lagThreshold: "30"
    #     offsetResetPolicy: earliest

