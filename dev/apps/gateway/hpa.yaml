apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fundit-gateway
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-gateway
    app.kubernetes.io/part-of: fundit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fundit-gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
