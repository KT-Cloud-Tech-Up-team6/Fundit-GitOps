apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundit-frontend
  namespace: dev
  labels:
    app: fundit-frontend
spec:
  # replicas는 hpa.yaml이 관리한다. 여기 두면 ArgoCD selfHeal이 HPA 값을 되돌린다.
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fundit-frontend
  template:
    metadata:
      labels:
        app: fundit-frontend
    spec:
      # 파드 2개로 운영해 spot 회수로 한 개가 옮겨져도 서비스가 유지된다.
      tolerations:
        - key: fundit.io/spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      # 한 AZ 장애에도 파드가 남도록 2a·2c에 나눠 띄운다.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          # 롤링 배포 중 이전 버전 파드를 세지 않도록 같은 ReplicaSet 파드끼리만 비교한다.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: fundit-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fundit-frontend
          image: 899957568205.dkr.ecr.ap-northeast-2.amazonaws.com/fundit-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
      terminationGracePeriodSeconds: 30
