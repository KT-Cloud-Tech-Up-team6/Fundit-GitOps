apiVersion: v1
kind: Service
metadata:
  name: fundit-auth-svc
  namespace: dev
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
  labels:
    app.kubernetes.io/name: fundit-auth
    app.kubernetes.io/part-of: fundit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fundit-auth
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
