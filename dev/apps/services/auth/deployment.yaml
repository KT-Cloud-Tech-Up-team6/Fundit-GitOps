apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundit-auth
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-auth
    app.kubernetes.io/part-of: fundit
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fundit-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fundit-auth
        app.kubernetes.io/part-of: fundit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: 899957568205.dkr.ecr.ap-northeast-2.amazonaws.com/fundit-backend:sha-auth-service-7dd5bd525f5080548f4e2fd7fee835a7fa0e92a9@sha256:e338a2e9cb4201bfd3972898ff4bd96529432461d5c141324dd0fe1396d925af
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fundit-auth-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: dbname
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: password
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?currentSchema=auth
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fundit-backend-secrets
                  key: internal-api-key
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: jwt-private-key
            - name: AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: auth-encryption-key
            - name: TEST_ACCOUNT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: test-account-password
            - name: PG_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: pg-store-id
            - name: PG_APIKEY
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: pg-api-key
            - name: KAKAO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: kakao-client-id
            - name: KAKAO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: kakao-client-secret
            - name: KAKAO_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: kakao-redirect-uri
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: google-client-secret
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: fundit-auth-secret
                  key: google-redirect-uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      terminationGracePeriodSeconds: 30
