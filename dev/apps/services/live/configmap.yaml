apiVersion: v1
kind: ConfigMap
metadata:
  name: fundit-live-config
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-live
    app.kubernetes.io/part-of: fundit
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka.kafka.svc.cluster.local:9092
  LIVE_IVS_MODE: stub
  LIVE_AI_MODE: http
  LIVE_AI_BASE_URL: http://fundit-ai-copilot-svc:8080/api/v1/ai
  SPRING_FLYWAY_DEFAULT_SCHEMA: live
  SPRING_FLYWAY_SCHEMAS: live
  SPRING_FLYWAY_CREATE_SCHEMAS: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: live
