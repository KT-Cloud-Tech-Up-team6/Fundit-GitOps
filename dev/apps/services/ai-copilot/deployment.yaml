apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundit-ai-copilot
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-ai-copilot
    app.kubernetes.io/part-of: fundit
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fundit-ai-copilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fundit-ai-copilot
        app.kubernetes.io/part-of: fundit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-copilot
          image: 899957568205.dkr.ecr.ap-northeast-2.amazonaws.com/fundit-ai-copilot
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if ! printenv API_TOKEN | grep -q . || ! test -s /var/secrets/google/service-account.json; then
                echo required-Copilot-API-token-or-Google-ADC-credential-is-missing >&2
                exit 1
              fi
              exec uvicorn api.main:app --host 0.0.0.0 --port 8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fundit-ai-copilot-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fundit-ai-copilot-secret
                  key: api-token
          volumeMounts:
            - name: data
              mountPath: /data
            - name: google-service-account
              mountPath: /var/secrets/google
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /api/v1/ai/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ai/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/ai/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fundit-ai-copilot-data
        - name: google-service-account
          secret:
            secretName: fundit-ai-copilot-gcp-sa
            items:
              - key: service-account.json
                path: service-account.json
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      terminationGracePeriodSeconds: 30
