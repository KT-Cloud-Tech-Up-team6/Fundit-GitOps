apiVersion: v1
kind: ConfigMap
metadata:
  name: fundit-ai-copilot-config
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-ai-copilot
    app.kubernetes.io/part-of: fundit
data:
  GOOGLE_GENAI_USE_VERTEXAI: "1"
  GOOGLE_CLOUD_PROJECT: live-copliot
  GOOGLE_CLOUD_LOCATION: global
  GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/service-account.json
  GEMINI_MODEL: gemini-3.5-flash-lite
  O_PART_REPHRASE: "0"
  LIVE_KNOWLEDGE_PATH: /data/live_knowledge.json
  RUNTIME_DIR: /data/runtime
