apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundit-payment
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-payment
    app.kubernetes.io/part-of: fundit
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fundit-payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fundit-payment
        app.kubernetes.io/part-of: fundit
    spec:
      serviceAccountName: fundit-backend-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment
          image: 899957568205.dkr.ecr.ap-northeast-2.amazonaws.com/fundit-backend:sha-payment-service-7dd5bd525f5080548f4e2fd7fee835a7fa0e92a9@sha256:e7a821e63fb4bbe148b541e5ce23507d426f4c19ec0ab732b24b98d13abcad33
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fundit-payment-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: dbname
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: password
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fundit-backend-secrets
                  key: internal-api-key
            - name: PAYMENT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: fundit-payment-secret
                  key: payment-encryption-key
            - name: TOSS_WIDGET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fundit-payment-secret
                  key: toss-widget-secret-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      terminationGracePeriodSeconds: 30
