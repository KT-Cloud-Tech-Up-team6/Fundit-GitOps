apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fundit-ai-highlight-data
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-ai-highlight
    app.kubernetes.io/part-of: fundit
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-retain
  resources:
    requests:
      storage: 10Gi
