apiVersion: v1
kind: Service
metadata:
  name: fundit-ai-highlight-svc
  namespace: dev
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  labels:
    app.kubernetes.io/name: fundit-ai-highlight
    app.kubernetes.io/part-of: fundit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fundit-ai-highlight
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
