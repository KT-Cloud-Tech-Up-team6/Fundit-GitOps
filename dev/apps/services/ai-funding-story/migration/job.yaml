apiVersion: batch/v1
kind: Job
metadata:
  name: fundit-ai-funding-story-migration
  namespace: dev
  annotations:
    # Flyway must succeed before API and workers in a later GitOps sync.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway
          # AI team migration image from source commit b93736a; reconfirm in ECR before activation.
          image: 899957568205.dkr.ecr.ap-northeast-2.amazonaws.com/fundit-ai-funding-story@sha256:ff1957195477241cb544cd91cc14c34504fbd9da97aeef6fc4acd04a36806150
          imagePullPolicy: IfNotPresent
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: funding-story-ai-migration-db
                  key: url
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: funding-story-ai-migration-db
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funding-story-ai-migration-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
