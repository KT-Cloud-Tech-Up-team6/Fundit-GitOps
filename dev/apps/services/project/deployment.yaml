apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundit-project
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-project
    app.kubernetes.io/part-of: fundit
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fundit-project
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fundit-project
        app.kubernetes.io/part-of: fundit
    spec:
      serviceAccountName: fundit-backend-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: project
          image: 899957568205.dkr.ecr.ap-northeast-2.amazonaws.com/fundit-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # Actuator 관리 포트. 백엔드 이미지가 8081로 분리하기 전에 미리 선언한다.
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fundit-project-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: dbname
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fundit-dev-postgres-app
                  key: password
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?currentSchema=project
            - name: FUNDING_STORY_AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: funding-story-ai-auth
                  key: service-token
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fundit-backend-secrets
                  key: internal-api-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # [전환 기간 한정] Actuator가 8080(구 이미지) 또는 8081(신 이미지)에 있으므로, 둘 중
          # 어디서든 /actuator/health가 200이면 통과시키는 호환 HTTP 체크를 쓴다.
          # - 구 이미지: 8081은 연결 거부, 8080 health 200 -> 통과 (health DOWN이면 503 -> 실패)
          # - 신 이미지: 8081 health 200 -> 통과 (DOWN이면 503, 8080은 404 -> 실패)
          # DB 연결 실패처럼 포트만 열린 상태는 두 이미지 모두 Ready가 되지 않는다.
          # 모든 서비스가 신 이미지로 교체되고 검증된 뒤 8081 httpGet으로 되돌리는 후속 PR로 제거한다.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -T 2 -O /dev/null http://127.0.0.1:8081/actuator/health || wget -q -T 2 -O /dev/null http://127.0.0.1:8080/actuator/health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -T 2 -O /dev/null http://127.0.0.1:8081/actuator/health || wget -q -T 2 -O /dev/null http://127.0.0.1:8080/actuator/health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -T 2 -O /dev/null http://127.0.0.1:8081/actuator/health || wget -q -T 2 -O /dev/null http://127.0.0.1:8080/actuator/health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      terminationGracePeriodSeconds: 30
