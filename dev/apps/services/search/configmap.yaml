apiVersion: v1
kind: ConfigMap
metadata:
  name: fundit-search-config
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-search
    app.kubernetes.io/part-of: fundit
data:
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  KAFKA_BOOTSTRAP_SERVERS: kafka.kafka.svc.cluster.local:9092
  LIVE_SERVICE_BASE_URL: http://fundit-live-svc:8080
  SPRING_FLYWAY_DEFAULT_SCHEMA: search
  SPRING_FLYWAY_SCHEMAS: search
  SPRING_FLYWAY_CREATE_SCHEMAS: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: search
