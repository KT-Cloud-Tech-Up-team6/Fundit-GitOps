apiVersion: v1
kind: Service
metadata:
  name: fundit-frontend-svc
  namespace: dev
  labels:
    app: fundit-frontend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /live
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  type: ClusterIP
  selector:
    app: fundit-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
