apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: fundit-dev-postgres-pooler
  namespace: dev
  labels:
    app.kubernetes.io/name: fundit-dev-postgres-pooler
    app.kubernetes.io/part-of: fundit
spec:
  cluster:
    name: fundit-dev-postgres

  # 고가용성(HA)을 위해 2대 실행
  instances: 2
  type: rw

  pgbouncer:
    # 트랜잭션 풀링 모드: 쿼리 트랜잭션이 끝나면 즉시 커넥션을 풀에 반납하여 커넥션 다중화(Multiplexing)
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
      min_pool_size: "5"
      reserve_pool_size: "5"
      # 파드마다 DB 별로 적용된다. DB 하나 기준 2대 합계 60 으로 max_connections(100) 안에 들어가게 한다
      max_db_connections: "30"
      ignore_startup_parameters: "extra_float_digits"

  template:
    metadata:
      labels:
        app.kubernetes.io/name: fundit-dev-postgres-pooler
    spec:
      # resources 없으면 BestEffort 로 떠서 노드 메모리 부족 시 가장 먼저 쫓겨난다
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
      # 가용영역(AZ) 편중 방지를 위한 Multi-AZ 자동 분산
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: fundit-dev-postgres-pooler
