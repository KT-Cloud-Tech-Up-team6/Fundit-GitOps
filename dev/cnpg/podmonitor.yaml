apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fundit-dev-postgres-metrics
  namespace: dev
  labels:
    # Prometheus의 podMonitorSelector가 이 라벨이 있는 PodMonitor만 수집한다.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: fundit-dev-postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
