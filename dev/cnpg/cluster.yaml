apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fundit-dev-postgres
  namespace: dev
spec:
  instances: 2

  # 기본값(unsupervised)이면 스펙 변경 시 오퍼레이터가 Standby 재시작→Switchover→
  # Primary 재시작을 통제 없이 자동으로 진행한다. stateful 노드그룹 이전 작업 중엔
  # 각 단계를 kubectl cnpg promote 등으로 직접 승인하기 위해 수동으로 둔다.
  primaryUpdateStrategy: supervised

  # 백엔드 로컬 개발(docker-compose, Testcontainers)이 전부 postgres:16을 쓴다.
  # imageName을 안 정하면 오퍼레이터 1.30.0 기본값(18.4)이 적용돼 버전이 어긋난다.
  imageName: ghcr.io/cloudnative-pg/postgresql:16-system-trixie

  # 보안점검 1차 감사 범위. SELECT(read)는 로그량·개인정보 정책 확정 후 별도로 추가한다.
  postgresql:
    shared_preload_libraries:
      - pgaudit
    parameters:
      pgaudit.log: "write,ddl,role,misc"
      # 바인드 파라미터에 비밀번호·개인정보가 남지 않도록 원문 값은 기록하지 않는다.
      pgaudit.log_parameter: "off"
      # DML 감사로그에 대상 relation 정보를 남기되 시스템 카탈로그 조회 잡음은 제외한다.
      pgaudit.log_relation: "on"
      pgaudit.log_catalog: "off"
      log_connections: "on"
      log_disconnections: "on"

  storage:
    size: 10Gi
    storageClass: gp3-retain

  walStorage:
    size: 5Gi
    storageClass: gp3-retain

  # resources 없으면 BestEffort로 떠서 노드 메모리 부족 시 DB가 먼저 죽고,
  # Karpenter도 노드 크기를 잡을 때 리소스를 0으로 인식한다.
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  monitoring:
    enablePodMonitor: true

  # topologyKey를 zone으로 지정해야 실제로 AZ 단위 분리가 된다.
  # 지정 안 하면 기본값은 노드(hostname) 단위라, 지금 두 노드가 서로 다른
  # AZ에 있어 우연히 AZ가 갈릴 뿐 보장되는 게 아니다.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
    podAntiAffinityType: preferred
    # stateful-ng 노드의 taint(workload=stateful:NoSchedule)를 통과하기 위한 톨러레이션
    tolerations:
      - key: workload
        operator: Equal
        value: stateful
        effect: NoSchedule
    # stateful-ng 노드(role=stateful)에만 스케줄되도록 고정
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: role
                operator: In
                values:
                  - stateful

  serviceAccountTemplate:
    metadata:
      annotations:
        # CNPGBackupRole의 신뢰 정책이 system:serviceaccount:dev:fundit-dev-postgres로
        # 고정돼 있어 Cluster 이름을 바꾸면 이 IRSA가 동작하지 않는다.
        eks.amazonaws.com/role-arn: arn:aws:iam::899957568205:role/CNPGBackupRole-fundit-dev-eks

  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      # Barman이 destinationPath 뒤에 서버 이름(클러스터 이름)을 자동으로 붙인다.
      # 여기서 클러스터 이름을 또 넣으면 경로가 두 번 겹친다.
      destinationPath: s3://fundit-dev-s3-db-backup
      s3Credentials:
        inheritFromIAMRole: true

  bootstrap:
    initdb: {}
