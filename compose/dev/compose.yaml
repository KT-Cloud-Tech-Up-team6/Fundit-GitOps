name: fundit-dev

services:
  gateway:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE in compose/dev/images.env}
    env_file:
      - path: ${GATEWAY_RUNTIME_ENV_FILE:?Set an absolute path to the server runtime file}
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HOST_PORT:-8080}:8080"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
