name: Validate dev Compose

on:
  pull_request:
    branches: [main]
    paths:
      - 'compose/dev/**'
      - 'scripts/deploy-dev.sh'
      - '.github/workflows/validate-dev-compose.yml'
      - '.gitignore'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'compose/dev/**'
      - 'scripts/deploy-dev.sh'
      - '.github/workflows/validate-dev-compose.yml'
      - '.gitignore'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-dev-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check script syntax and lint
        run: |
          bash -n scripts/deploy-dev.sh
          shellcheck scripts/deploy-dev.sh

      - name: Validate Compose and deployment preflight with dummy data
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t image_assignments < <(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' compose/dev/images.env)
          if [[ ${#image_assignments[@]} -ne 1 ]] || [[ ! "${image_assignments[0]}" =~ ^GATEWAY_IMAGE=[^[:space:]]+$ ]]; then
            echo 'images.env must contain exactly one unquoted GATEWAY_IMAGE assignment.' >&2
            exit 1
          fi
          umask 077
          validation_root=$(mktemp -d "$RUNNER_TEMP/fundit-compose.XXXXXX")
          trap 'rm -rf -- "$validation_root"' EXIT
          mkdir -p "$validation_root/repo/compose/dev" "$validation_root/repo/scripts"
          cp compose/dev/compose.yaml "$validation_root/repo/compose/dev/"
          cp scripts/deploy-dev.sh "$validation_root/repo/scripts/"
          cat > "$validation_root/gateway.env" <<'ENV'
          AUTH_SERVICE_BASE_URL=http://auth.invalid:8080
          MEMBER_SERVICE_BASE_URL=http://member.invalid:8080
          PAYMENT_SERVICE_BASE_URL=http://payment.invalid:8080
          INTERNAL_API_KEY=ci-only-value-$literal
          ENV
          # The fake image is only parsed. This workflow never logs into ECR or pulls it.
          printf '%s\n' 'GATEWAY_IMAGE=000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/gateway:sha-0000000000000000000000000000000000000000' \
            > "$validation_root/repo/compose/dev/images.env"
          bash "$validation_root/repo/scripts/deploy-dev.sh" --check "$validation_root/gateway.env"

          # Validate the Git-managed release reference once the initial placeholder is replaced.
          if [[ "${image_assignments[0]}" != 'GATEWAY_IMAGE=REPLACE_WITH_ECR_IMAGE_URI' ]]; then
            bash scripts/deploy-dev.sh --check "$validation_root/gateway.env"
          fi

          # The checked-in template intentionally cannot deploy until an image is configured.
          cp compose/dev/images.env "$validation_root/repo/compose/dev/images.env"
          if [[ "${image_assignments[0]}" == 'GATEWAY_IMAGE=REPLACE_WITH_ECR_IMAGE_URI' ]]; then
            if bash "$validation_root/repo/scripts/deploy-dev.sh" --check "$validation_root/gateway.env"; then
              echo 'An unconfigured image must fail preflight.' >&2
              exit 1
            fi
          fi
