name: Dispatch Cuesheet image update

on:
  workflow_dispatch:
    inputs:
      image_tag:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gitops-image-update-main
  cancel-in-progress: false

jobs:
  update-cuesheet-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Cuesheet is private. Its ECR push Role trusts only that repository's
      # main branch; verify the exact tag/digest in ECR without another token.
      - name: Validate image identity
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid source SHA'; exit 1; }
          [[ "$IMAGE_TAG" == "sha-$SOURCE_SHA" ]] || { echo '::error::Tag/source mismatch'; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Invalid digest'; exit 1; }

      - name: Configure AWS credentials for ECR read
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GITOPS_BE_AI_ECR_READ_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Verify ECR tag and digest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          actual="$(aws ecr describe-images --repository-name fundit-ai-cuesheet \
            --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$actual" == "$IMAGE_DIGEST" ]] || { echo '::error::ECR tag/digest mismatch'; exit 1; }

      - name: Create GitOps CD App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GITOPS_CD_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_CD_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout GitOps main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Update only Cuesheet image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          target = Path('dev/apps/services/ai-cuesheet/kustomization.yaml')
          original = target.read_text(encoding='utf-8')
          image = '899957568205.dkr.ecr.ap-northeast-2.amazonaws.com/fundit-ai-cuesheet'
          pattern = r'(- name: ' + re.escape(image) + r'\n    newTag: )\S+(\n    digest: )\S+'
          updated, count = re.subn(pattern, lambda m: (
              m.group(1) + os.environ['IMAGE_TAG'] + m.group(2) + os.environ['IMAGE_DIGEST']
          ), original)
          if count != 1:
              sys.exit(f'Expected one Cuesheet image entry, found {count}')
          target.write_text(updated, encoding='utf-8')
          PY

      - name: Verify and push allowed change
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          target=dev/apps/services/ai-cuesheet/kustomization.yaml
          changed="$(git diff --name-only)"
          [[ -n "$changed" ]] || exit 0
          [[ "$changed" == "$target" ]] || { echo '::error::Unexpected file change'; exit 1; }
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m "chore(ai-cuesheet): deploy $IMAGE_TAG"
          git push origin HEAD:main
