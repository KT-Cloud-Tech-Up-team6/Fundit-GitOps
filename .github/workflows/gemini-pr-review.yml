name: Gemini PR Inline Code Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - '**.lock'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # PR 코드가 아닌 기본 브랜치의 신뢰된 revision을 체크아웃하여 스크립트 변조 방지
      - name: Checkout trusted base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      # PR head는 실행하지 않고 오직 diff 데이터만 비교하기 위해 fetch 수행
      - name: Fetch PR head revision
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Check review script on base branch
        id: check_script
        run: |
          if [ ! -f "scripts/gemini_pr_review.py" ]; then
            echo "Notice: scripts/gemini_pr_review.py not found on base branch '${{ github.base_ref }}'. Skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_script.outputs.skip != 'true'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_script.outputs.skip != 'true'
        run: |
          pip install --no-cache-dir google-genai==1.3.0 requests==2.32.3

      - name: Inline Review with Gemini
        if: steps.check_script.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python scripts/gemini_pr_review.py

