name: Gemini PR Code Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - '**.lock'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai requests

      - name: Get PR Diff & Review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - << 'PYEOF'
          import os
          import subprocess
          import requests
          from google import genai

          base_ref = "${{ github.base_ref }}"
          diff_command = f"git diff origin/{base_ref}...HEAD"
          try:
              diff_output = subprocess.check_output(diff_command, shell=True, text=True)
          except subprocess.CalledProcessError:
              diff_output = ""

          if not diff_output.strip():
              print("No changes found to review.")
              exit(0)

          max_chars = 60000
          if len(diff_output) > max_chars:
              diff_output = diff_output[:max_chars] + "\n... (Diff truncated due to size limit)"

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          prompt = f"""
          당신은 노련한 시니어 클라우드 인프라 및 GitOps 플랫폼 엔지니어입니다.
          제공된 GitHub PR의 git diff를 분석하고, 한국어로 정중하고 건설적인 코드 리뷰를 작성해주세요.

          ### 리뷰 기준:
          1. **3줄 핵심 요약**: 어떤 변경 사항인지 요약
          2. **보안 및 위험도 점검**:
             - 하드코딩된 패스워드, API 키, AWS 토큰 유출 여부
             - Kubernetes 매니페스트 보안 (root 권한 실행, privileged 모드, 리소스 Limit 누락 등)
             - Helm 차트 values 문법 및 구조적 위험
          3. **개선 제안**: 모범 사례(Best Practice)에 맞춘 개선점
          4. **총평**: Merge 가능 여부 (LGTM / 수정 요청)

          ---
          Git Diff:
          ```diff
          {diff_output}
          ```
          """

          print("Requesting review from Gemini...")
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt
          )
          review_comment = response.text

          repo = os.environ["REPO_NAME"]
          pr_num = os.environ["PR_NUMBER"]
          gh_token = os.environ["GITHUB_TOKEN"]

          comment_body = f"## 🤖 Gemini AI Code Review\n\n{review_comment}\n\n---\n*Automated review by Gemini Flash*"
          
          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github.v3+json"
          }
          url = f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments"
          res = requests.post(url, json={"body": comment_body}, headers=headers)

          if res.status_code == 201:
              print("Review comment posted successfully!")
          else:
              print(f"Failed to post comment: {res.text}")
              exit(1)
          PYEOF
